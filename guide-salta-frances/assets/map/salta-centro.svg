<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#5b4a36" flood-opacity=".18"/>
    </filter>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f7f0e3"/>
      <path d="M0 2H12M3 0V12" stroke="#9c8566" stroke-opacity=".035"/>
    </pattern>
    <g id="tree">
      <circle cx="0" cy="0" r="14" fill="#6d9d4b" stroke="#456d32" stroke-width="3"/>
      <circle cx="-9" cy="-4" r="8" fill="#79aa54"/>
      <circle cx="8" cy="-6" r="8" fill="#82b45d"/>
      <rect x="-2" y="12" width="4" height="10" rx="2" fill="#7c5738"/>
    </g>
    <g id="smallhouse">
      <rect x="0" y="10" width="48" height="35" rx="2" fill="#e7ded0" stroke="#806c57" stroke-width="2"/>
      <path d="M-3 12L24 0l27 12" fill="#d86f43" stroke="#8c5237" stroke-width="2"/>
      <rect x="8" y="22" width="11" height="12" fill="#adc7d6"/>
      <rect x="29" y="20" width="10" height="25" fill="#aa8a67"/>
    </g>
  </defs>

  <rect width="1000" height="760" fill="url(#paper)"/>

  <!-- city texture -->
  <g opacity=".9">
    <use href="#smallhouse" x="25" y="18"/><use href="#smallhouse" x="92" y="34"/>
    <use href="#smallhouse" x="175" y="16"/><use href="#smallhouse" x="250" y="30"/>
    <use href="#smallhouse" x="720" y="18"/><use href="#smallhouse" x="795" y="32"/>
    <use href="#smallhouse" x="872" y="14"/>

    <use href="#smallhouse" x="20" y="210"/><use href="#smallhouse" x="93" y="225"/>
    <use href="#smallhouse" x="820" y="220"/><use href="#smallhouse" x="890" y="205"/>

    <use href="#smallhouse" x="22" y="520"/><use href="#smallhouse" x="92" y="535"/>
    <use href="#smallhouse" x="790" y="548"/><use href="#smallhouse" x="865" y="530"/>
    <use href="#smallhouse" x="925" y="570"/>
  </g>

  <!-- Roads -->
  <g>
    <rect x="0" y="190" width="1000" height="58" fill="#aeb8c3"/>
    <rect x="0" y="505" width="1000" height="58" fill="#aeb8c3"/>
    <rect x="305" y="0" width="62" height="760" fill="#aeb8c3"/>
    <rect x="635" y="0" width="62" height="760" fill="#aeb8c3"/>

    <g stroke="#f4f3ed" stroke-width="4" stroke-dasharray="23 18" opacity=".95">
      <path d="M0 219H1000"/><path d="M0 534H1000"/>
      <path d="M336 0V760"/><path d="M666 0V760"/>
    </g>

    <!-- Crosswalks -->
    <g stroke="#f8f7f2" stroke-width="6" opacity=".95">
      <path d="M308 198l55 0M308 210l55 0M308 222l55 0M308 234l55 0"/>
      <path d="M638 198l55 0M638 210l55 0M638 222l55 0M638 234l55 0"/>
      <path d="M308 513l55 0M308 525l55 0M308 537l55 0M308 549l55 0"/>
      <path d="M638 513l55 0M638 525l55 0M638 537l55 0M638 549l55 0"/>
    </g>
  </g>

  <!-- Street labels -->
  <g font-family="Nunito,Arial,sans-serif" font-size="22" font-weight="900" fill="#17355f">
    <g>
      <rect x="413" y="198" width="175" height="38" rx="18" fill="#fbf7ee" stroke="#d7c7b0" stroke-width="2"/>
      <text x="500" y="225" text-anchor="middle">España</text>
    </g>
    <g>
      <rect x="420" y="513" width="160" height="38" rx="18" fill="#fbf7ee" stroke="#d7c7b0" stroke-width="2"/>
      <text x="500" y="540" text-anchor="middle">Caseros</text>
    </g>
    <g transform="translate(336 370) rotate(-90)">
      <rect x="-55" y="-19" width="110" height="38" rx="18" fill="#fbf7ee" stroke="#d7c7b0" stroke-width="2"/>
      <text x="0" y="8" text-anchor="middle">Mitre</text>
    </g>
    <g transform="translate(666 370) rotate(-90)">
      <rect x="-67" y="-19" width="134" height="38" rx="18" fill="#fbf7ee" stroke="#d7c7b0" stroke-width="2"/>
      <text x="0" y="8" text-anchor="middle">Zuviría</text>
    </g>
  </g>

  <!-- Cathedral -->
  <g filter="url(#shadow)">
    <rect x="385" y="54" width="230" height="125" rx="5" fill="#e9cf80" stroke="#8a6934" stroke-width="4"/>
    <rect x="465" y="87" width="70" height="92" fill="#f2d991" stroke="#8a6934" stroke-width="3"/>
    <path d="M468 88L500 62l32 26" fill="#e5bd5c" stroke="#8a6934" stroke-width="3"/>
    <rect x="405" y="48" width="42" height="131" fill="#efd47e" stroke="#8a6934" stroke-width="3"/>
    <rect x="553" y="48" width="42" height="131" fill="#efd47e" stroke="#8a6934" stroke-width="3"/>
    <path d="M410 48Q426 15 442 48M558 48Q574 15 590 48" fill="#e7ba4d" stroke="#8a6934" stroke-width="3"/>
    <path d="M426 15V5M574 15V5" stroke="#5f4a2e" stroke-width="3"/>
    <path d="M418 9h16M566 9h16" stroke="#5f4a2e" stroke-width="3"/>
    <rect x="486" y="135" width="28" height="44" rx="13" fill="#704d32"/>
    <g fill="#9cc3dc" stroke="#765d40" stroke-width="2">
      <rect x="414" y="83" width="13" height="20"/><rect x="565" y="83" width="13" height="20"/>
      <rect x="478" y="101" width="15" height="20"/><rect x="507" y="101" width="15" height="20"/>
    </g>
  </g>
  <g font-family="Nunito,Arial" font-weight="900" fill="#17355f">
    <rect x="382" y="18" width="236" height="36" rx="18" fill="#fffaf0" stroke="#17355f" stroke-width="3"/>
    <text x="500" y="43" font-size="20" text-anchor="middle">Cathédrale Basilique</text>
  </g>

  <!-- Plaza -->
  <g filter="url(#shadow)">
    <rect x="380" y="265" width="240" height="220" rx="8" fill="#dfead1" stroke="#7b8b62" stroke-width="4"/>
    <path d="M390 275L610 475M610 275L390 475" stroke="#eee6d6" stroke-width="20"/>
    <path d="M500 276V474M390 375H610" stroke="#eee6d6" stroke-width="14"/>
    <circle cx="500" cy="375" r="43" fill="#76c5d9" stroke="#3f7f94" stroke-width="5"/>
    <circle cx="500" cy="375" r="19" fill="#bce5ea" stroke="#3f7f94" stroke-width="4"/>
    <circle cx="500" cy="355" r="8" fill="#f8f4e9" stroke="#3f7f94" stroke-width="3"/>
    <path d="M500 350V331" stroke="#3f7f94" stroke-width="5" stroke-linecap="round"/>
    <g>
      <use href="#tree" x="410" y="300"/><use href="#tree" x="455" y="310"/><use href="#tree" x="550" y="305"/><use href="#tree" x="592" y="300"/>
      <use href="#tree" x="410" y="448"/><use href="#tree" x="455" y="438"/><use href="#tree" x="550" y="442"/><use href="#tree" x="592" y="448"/>
      <use href="#tree" x="405" y="368"/><use href="#tree" x="595" y="368"/>
    </g>
  </g>
  <g font-family="Nunito,Arial" font-weight="900">
    <rect x="434" y="454" width="132" height="26" rx="13" fill="#fffaf0" stroke="#17355f" stroke-width="2"/>
    <text x="500" y="473" text-anchor="middle" font-size="15" fill="#17355f">Plaza 9 de Julio</text>
  </g>

  <!-- MAAM -->
  <g filter="url(#shadow)">
    <rect x="80" y="305" width="190" height="130" fill="#e8e4da" stroke="#756f66" stroke-width="4"/>
    <rect x="100" y="338" width="150" height="97" fill="#f3eee5" stroke="#94897a" stroke-width="2"/>
    <rect x="145" y="365" width="60" height="70" fill="#8eb5c6" stroke="#5d7380" stroke-width="3"/>
    <g fill="#b7d0d9" stroke="#6d8088" stroke-width="2">
      <rect x="109" y="365" width="27" height="32"/><rect x="214" y="365" width="27" height="32"/>
    </g>
    <text x="175" y="331" font-family="Nunito,Arial" font-size="19" font-weight="900" text-anchor="middle" fill="#2f3e4a">MAAM</text>
  </g>
  <g font-family="Nunito,Arial" font-weight="900">
    <rect x="72" y="445" width="206" height="40" rx="18" fill="#fffaf0" stroke="#17355f" stroke-width="3"/>
    <text x="175" y="470" text-anchor="middle" font-size="16" fill="#17355f">MAAM · Musée d'Archéologie</text>
  </g>

  <!-- Teatro -->
  <g filter="url(#shadow)">
    <rect x="730" y="300" width="205" height="160" fill="#eadfcd" stroke="#7d6d5e" stroke-width="4"/>
    <path d="M750 345h165v105H750z" fill="#f1e8dc" stroke="#9e8975" stroke-width="3"/>
    <path d="M755 345l78-32 77 32" fill="#d76840" stroke="#8d4e37" stroke-width="3"/>
    <g fill="#a9c5d4" stroke="#728895" stroke-width="2">
      <rect x="765" y="365" width="25" height="38"/><rect x="800" y="365" width="25" height="38"/><rect x="840" y="365" width="25" height="38"/><rect x="875" y="365" width="25" height="38"/>
    </g>
    <rect x="820" y="408" width="30" height="42" fill="#76533d"/>
  </g>
  <g font-family="Nunito,Arial" font-weight="900">
    <rect x="748" y="268" width="170" height="36" rx="18" fill="#fffaf0" stroke="#17355f" stroke-width="3"/>
    <text x="833" y="292" text-anchor="middle" font-size="18" fill="#17355f">Théâtre Provincial</text>
  </g>

  <!-- Cabildo -->
  <g filter="url(#shadow)">
    <rect x="390" y="590" width="220" height="118" fill="#eee4d6" stroke="#7f6d59" stroke-width="4"/>
    <path d="M405 590h190v-40h-190z" fill="#d66b42" stroke="#8f4d35" stroke-width="3"/>
    <path d="M455 590v-58h90v58" fill="#e9dfd3" stroke="#7f6d59" stroke-width="3"/>
    <rect x="485" y="545" width="30" height="45" fill="#f7f3ed" stroke="#7f6d59" stroke-width="3"/>
    <g fill="#f8f5ef" stroke="#7f6d59" stroke-width="2">
      <path d="M405 620h190M405 659h190"/>
      <path d="M420 620v39M450 620v39M480 620v39M520 620v39M550 620v39M580 620v39"/>
    </g>
    <g fill="#7b563f">
      <rect x="413" y="668" width="20" height="40"/><rect x="445" y="668" width="20" height="40"/><rect x="477" y="668" width="20" height="40"/>
      <rect x="509" y="668" width="20" height="40"/><rect x="541" y="668" width="20" height="40"/><rect x="573" y="668" width="20" height="40"/>
    </g>
  </g>
  <g font-family="Nunito,Arial" font-weight="900">
    <rect x="410" y="707" width="180" height="36" rx="18" fill="#fffaf0" stroke="#17355f" stroke-width="3"/>
    <text x="500" y="731" text-anchor="middle" font-size="18" fill="#17355f">Cabildo Historique</text>
  </g>

  <!-- secondary POIs -->
  <g filter="url(#shadow)" font-family="Nunito,Arial">
    <g transform="translate(760 530)">
      <rect width="160" height="95" rx="8" fill="#f0d9c8" stroke="#8a684f" stroke-width="3"/>
      <path d="M15 30h130M30 15v65M80 15v65M130 15v65" stroke="#a87858" stroke-width="2"/>
      <text x="80" y="55" text-anchor="middle" font-weight="900" fill="#17355f">San Francisco</text>
    </g>
    <g transform="translate(80 590)">
      <rect width="175" height="88" rx="8" fill="#e7ead6" stroke="#76805b" stroke-width="3"/>
      <text x="87" y="40" text-anchor="middle" font-weight="900" fill="#17355f">Mercado</text>
      <text x="87" y="61" text-anchor="middle" font-size="14" fill="#17355f">San Miguel</text>
    </g>
    <g transform="translate(825 120)">
      <rect width="145" height="92" rx="8" fill="#e5def4" stroke="#766c8d" stroke-width="3"/>
      <path d="M20 68L72 20l53 48" stroke="#766c8d" stroke-width="4" fill="none"/>
      <circle cx="72" cy="20" r="9" fill="#7650d8"/>
      <text x="72" y="84" text-anchor="middle" font-weight="900" fill="#17355f">Téléphérique</text>
    </g>
  </g>

  <!-- trees around buildings -->
  <g opacity=".95">
    <use href="#tree" x="350" y="78"/><use href="#tree" x="650" y="80"/>
    <use href="#tree" x="300" y="280"/><use href="#tree" x="700" y="280"/>
    <use href="#tree" x="290" y="470"/><use href="#tree" x="710" y="470"/>
    <use href="#tree" x="350" y="600"/><use href="#tree" x="650" y="605"/>
  </g>

  <!-- decorative plan label -->
  <g transform="translate(25 25)" filter="url(#shadow)">
    <rect width="245" height="98" rx="12" fill="#fffaf0" stroke="#17355f" stroke-width="4"/>
    <text x="122" y="38" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="24" font-weight="700" fill="#17355f">Plan touristique</text>
    <text x="122" y="75" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="800" fill="#17355f">Salta</text>
  </g>

  <!-- Compass -->
  <g transform="translate(944 45)">
    <rect x="-34" y="-30" width="68" height="86" rx="22" fill="#fffaf0" stroke="#d9ceb9" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Nunito,Arial" font-weight="900" font-size="22" fill="#17355f">N</text>
    <path d="M0 5L-16 44L0 34L16 44Z" fill="#17355f"/>
  </g>
</svg>
